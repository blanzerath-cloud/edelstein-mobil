<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirchen-Mitfahrbörse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
        }
        .tab-active {
            border-bottom: 4px solid #3b82f6;
            color: #3b82f6;
            font-weight: 600;
        }
        .tab-inactive {
            color: #6b7280;
            border-bottom: 4px solid transparent;
        }
        .tab-inactive:hover {
            color: #374151;
            border-bottom: 4px solid #d1d5db;
        }
        
        /* Custom Scrollbar for better UI */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <header class="bg-white shadow-sm sticky top-0 z-10">
        <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-blue-100 text-blue-600 p-2 rounded-full w-10 h-10 flex items-center justify-center">
                    <i class="fa-solid fa-church text-lg"></i>
                </div>
                <h1 class="text-xl sm:text-2xl font-bold text-gray-800">Edelsteingemeinde mobil</h1>
            </div>
            <div id="authStatus" class="text-xs text-gray-500 flex items-center gap-1">
                <i class="fa-solid fa-circle-notch fa-spin text-blue-500"></i> Verbinde...
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-3xl mx-auto w-full px-4 sm:px-6 py-6 flex flex-col gap-6">
        
        <!-- Welcome Section -->
        <section class="bg-blue-50 rounded-2xl p-6 text-center shadow-sm border border-blue-100">
            <h2 class="text-lg sm:text-xl font-semibold text-blue-800 mb-2">Gemeinsam zum Gottesdienst</h2>
            <p class="text-sm sm:text-base text-blue-700">Teile eine Fahrt oder finde eine Mitfahrgelegenheit. Organisiere dich unkompliziert mit anderen Gemeindemitgliedern.</p>
        </section>

        <!-- Tabs -->
        <div class="flex w-full border-b border-gray-200">
            <button id="tabOffers" onclick="switchTab('offers')" class="flex-1 py-3 text-center tab-active transition-colors flex items-center justify-center gap-2">
                <i class="fa-solid fa-car-side"></i> Angebote
            </button>
            <button id="tabRequests" onclick="switchTab('requests')" class="flex-1 py-3 text-center tab-inactive transition-colors flex items-center justify-center gap-2">
                <i class="fa-solid fa-hand"></i> Gesuche
            </button>
        </div>

        <!-- Content Area -->
        <div id="offersView" class="flex flex-col gap-4">
            <div class="flex justify-between items-center mb-2">
                <h3 class="text-lg font-semibold text-gray-700">Aktuelle Angebote</h3>
                <button onclick="openModal('offerModal')" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow transition-colors flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> Fahrt anbieten
                </button>
            </div>
            <div id="offersList" class="flex flex-col gap-4 min-h-[200px]">
                <!-- Offers will be injected here -->
                <div class="text-center text-gray-500 py-8"><i class="fa-solid fa-spinner fa-spin mr-2"></i> Lade Angebote...</div>
            </div>
        </div>

        <div id="requestsView" class="hidden flex flex-col gap-4">
            <div class="flex justify-between items-center mb-2">
                <h3 class="text-lg font-semibold text-gray-700">Aktuelle Gesuche</h3>
                <button onclick="openModal('requestModal')" class="bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-lg text-sm font-medium shadow transition-colors flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> Fahrt suchen
                </button>
            </div>
            <div id="requestsList" class="flex flex-col gap-4 min-h-[200px]">
                <!-- Requests will be injected here -->
                <div class="text-center text-gray-500 py-8"><i class="fa-solid fa-spinner fa-spin mr-2"></i> Lade Gesuche...</div>
            </div>
        </div>
    </main>

    <!-- Offer Form Modal -->
    <div id="offerModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4 fade-in">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden flex flex-col max-h-[90vh]">
            <div class="px-6 py-4 border-b flex justify-between items-center bg-blue-50">
                <h3 class="text-lg font-bold text-blue-800"><i class="fa-solid fa-car-side mr-2"></i> Fahrt anbieten</h3>
                <button onclick="closeModal('offerModal')" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form id="offerForm" class="p-6 overflow-y-auto flex-grow flex flex-col gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Dein Name</label>
                    <input type="text" id="offerName" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" placeholder="z.B. Max Mustermann">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Startort / Treffpunkt</label>
                    <input type="text" id="offerLocation" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" placeholder="z.B. Marktplatz">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Datum</label>
                        <input type="date" id="offerDate" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Uhrzeit</label>
                        <input type="time" id="offerTime" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Freie Plätze</label>
                    <input type="number" id="offerSeats" min="1" max="8" value="1" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                </div>
                <button type="submit" id="offerSubmitBtn" class="mt-4 w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition shadow">Angebot veröffentlichen</button>
            </form>
        </div>
    </div>

    <!-- Request Form Modal -->
    <div id="requestModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4 fade-in">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden flex flex-col max-h-[90vh]">
            <div class="px-6 py-4 border-b flex justify-between items-center bg-orange-50">
                <h3 class="text-lg font-bold text-orange-800"><i class="fa-solid fa-hand mr-2"></i> Fahrt suchen</h3>
                <button onclick="closeModal('requestModal')" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form id="requestForm" class="p-6 overflow-y-auto flex-grow flex flex-col gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Dein Name</label>
                    <input type="text" id="requestName" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none" placeholder="z.B. Maria Musterfrau">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Gewünschter Abholort</label>
                    <input type="text" id="requestLocation" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none" placeholder="z.B. Hauptbahnhof">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Datum</label>
                        <input type="date" id="requestDate" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Uhrzeit</label>
                        <input type="time" id="requestTime" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Anzahl Personen</label>
                    <input type="number" id="requestSeats" min="1" max="8" value="1" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none">
                </div>
                <button type="submit" id="requestSubmitBtn" class="mt-4 w-full bg-orange-500 text-white font-semibold py-3 rounded-lg hover:bg-orange-600 transition shadow">Gesuch veröffentlichen</button>
            </form>
        </div>
    </div>

    <!-- Custom Toast Notification -->
    <div id="toast" class="fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-xl z-50 transition-all duration-300 translate-y-20 opacity-0 flex items-center gap-2">
        <i class="fa-solid fa-circle-info"></i> <span id="toastMsg"></span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Environment variables
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'kirchen-mitfahr-app-123';
        const firebaseConfig = {
          apiKey: "AIzaSyAawTRBG47m9vKP48_benrv8BCHW-RVZB0",
          authDomain: "edelsteingemeinde-mobil.firebaseapp.com",
          projectId: "edelsteingemeinde-mobil",
          storageBucket: "edelsteingemeinde-mobil.firebasestorage.app",
          messagingSenderId: "104780035793",
          appId: "1:104780035793:web:3c3efe15203996056e37f0"
        };
        const authToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        // Init Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        let currentUser = null;
        let allRides = [];

        // Global functions for HTML onClick
        window.switchTab = switchTab;
        window.openModal = openModal;
        window.closeModal = closeModal;
        window.deleteRide = deleteRide;
        window.shareToWhatsApp = shareToWhatsApp;

        // UI State
        let currentTab = 'offers';

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = message;
            if (isError) {
                toast.classList.replace('bg-gray-800', 'bg-red-600');
            } else {
                toast.classList.replace('bg-red-600', 'bg-gray-800');
            }
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        async function initApp() {
            try {
                if (authToken) {
                    await signInWithCustomToken(auth, authToken);
                } else {
                    await signInAnonymously(auth);
                }
                
                currentUser = auth.currentUser;
                document.getElementById('authStatus').innerHTML = `<i class="fa-solid fa-circle-check text-green-500"></i> Bereit`;
                
                // Pre-fill today's date in forms
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('offerDate').value = today;
                document.getElementById('requestDate').value = today;

                listenToRides();
            } catch (error) {
                console.error("Auth Error:", error);
                document.getElementById('authStatus').innerHTML = `<i class="fa-solid fa-triangle-exclamation text-red-500"></i> Fehler`;
                showToast("Fehler bei der Anmeldung.", true);
            }
        }

        function listenToRides() {
            if (!currentUser) return;

            const ridesRef = collection(db, 'artifacts', appId, 'public', 'data', 'rides');
            
            // Simple query, no ordering to follow RULE 2
            onSnapshot(ridesRef, (snapshot) => {
                allRides = [];
                snapshot.forEach((doc) => {
                    allRides.push({ id: doc.id, ...doc.data() });
                });
                renderLists();
            }, (error) => {
                console.error("Firestore error:", error);
                showToast("Fehler beim Laden der Daten.", true);
            });
        }

        // Add Offer
        document.getElementById('offerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return;
            
            const btn = document.getElementById('offerSubmitBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Speichere...';
            btn.disabled = true;

            const data = {
                type: 'offer',
                name: document.getElementById('offerName').value.trim(),
                location: document.getElementById('offerLocation').value.trim(),
                date: document.getElementById('offerDate').value,
                time: document.getElementById('offerTime').value,
                seats: parseInt(document.getElementById('offerSeats').value),
                authorId: currentUser.uid,
                createdAt: serverTimestamp()
            };

            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'rides'), data);
                closeModal('offerModal');
                document.getElementById('offerForm').reset();
                showToast("Angebot erfolgreich erstellt!");
            } catch (err) {
                showToast("Fehler beim Speichern.", true);
                console.error(err);
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });

        // Add Request
        document.getElementById('requestForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return;

            const btn = document.getElementById('requestSubmitBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Speichere...';
            btn.disabled = true;

            const data = {
                type: 'request',
                name: document.getElementById('requestName').value.trim(),
                location: document.getElementById('requestLocation').value.trim(),
                date: document.getElementById('requestDate').value,
                time: document.getElementById('requestTime').value,
                seats: parseInt(document.getElementById('requestSeats').value), // here it means 'Anzahl Personen'
                authorId: currentUser.uid,
                createdAt: serverTimestamp()
            };

            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'rides'), data);
                closeModal('requestModal');
                document.getElementById('requestForm').reset();
                showToast("Gesuch erfolgreich erstellt!");
            } catch (err) {
                showToast("Fehler beim Speichern.", true);
                console.error(err);
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });

        async function deleteRide(id) {
            if(!currentUser) return;
            // Basic confirm-like modal would be better, but implementing simple direct delete for UI smoothness
            try {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'rides', id));
                showToast("Eintrag gelöscht.");
            } catch (err) {
                showToast("Fehler beim Löschen.", true);
                console.error(err);
            }
        }

        function shareToWhatsApp(id) {
            const ride = allRides.find(r => r.id === id);
            if (!ride) return;

            // Format date for German locale (DD.MM.YYYY)
            const dateParts = ride.date.split('-');
            const formattedDate = dateParts.length === 3 ? `${dateParts[2]}.${dateParts[1]}.${dateParts[0]}` : ride.date;

            let text = "";
            if (ride.type === 'offer') {
                text = `🚙 *Mitfahrgelegenheit zum Gottesdienst*\n\n` +
                       `Ich biete eine Fahrt an!\n` +
                       `📍 *Start:* ${ride.location}\n` +
                       `📅 *Wann:* ${formattedDate} um ${ride.time} Uhr\n` +
                       `💺 *Freie Plätze:* ${ride.seats}\n` +
                       `👤 *Fahrer/in:* ${ride.name}\n\n` +
                       `Wer mitfahren möchte, meldet sich am besten direkt bei mir! 🙏`;
            } else {
                text = `🙋‍♂️ *Mitfahrgelegenheit gesucht*\n\n` +
                       `Ich suche eine Mitfahrgelegenheit zum Gottesdienst!\n` +
                       `📍 *Abholung:* ${ride.location}\n` +
                       `📅 *Wann:* ${formattedDate} bis ${ride.time} Uhr\n` +
                       `👥 *Personen:* ${ride.seats}\n` +
                       `👤 *Suchende/r:* ${ride.name}\n\n` +
                       `Wer kann mich/uns mitnehmen? Bitte meldet euch! 🙏`;
            }

            const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        }

        function renderLists() {
            const offersList = document.getElementById('offersList');
            const requestsList = document.getElementById('requestsList');

            // Sort by date (descending for now, or ascending. Let's do ascending for upcoming events)
            const sortedRides = [...allRides].sort((a, b) => {
                const dateA = new Date(`${a.date}T${a.time}`);
                const dateB = new Date(`${b.date}T${b.time}`);
                return dateA - dateB;
            });

            const offers = sortedRides.filter(r => r.type === 'offer');
            const requests = sortedRides.filter(r => r.type === 'request');

            offersList.innerHTML = offers.length ? offers.map(renderCard).join('') : 
                `<div class="text-center py-10 bg-white rounded-xl shadow-sm border border-gray-100 text-gray-500">
                    <i class="fa-solid fa-car-side text-3xl mb-2 text-gray-300"></i>
                    <p>Zurzeit keine Angebote vorhanden.</p>
                 </div>`;

            requestsList.innerHTML = requests.length ? requests.map(renderCard).join('') : 
                `<div class="text-center py-10 bg-white rounded-xl shadow-sm border border-gray-100 text-gray-500">
                    <i class="fa-solid fa-hand text-3xl mb-2 text-gray-300"></i>
                    <p>Zurzeit keine Gesuche vorhanden.</p>
                 </div>`;
        }

        function renderCard(ride) {
            const isAuthor = currentUser && currentUser.uid === ride.authorId;
            const isOffer = ride.type === 'offer';
            
            const badgeClass = isOffer ? 'bg-blue-100 text-blue-800' : 'bg-orange-100 text-orange-800';
            const iconClass = isOffer ? 'fa-car-side' : 'fa-person';
            const seatsLabel = isOffer ? (ride.seats === 1 ? '1 freier Platz' : `${ride.seats} freie Plätze`) 
                                       : (ride.seats === 1 ? '1 Person' : `${ride.seats} Personen`);
            
            // Format Date (DD.MM.YYYY)
            const dateParts = ride.date.split('-');
            const formattedDate = dateParts.length === 3 ? `${dateParts[2]}.${dateParts[1]}.${dateParts[0]}` : ride.date;

            return `
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 flex flex-col gap-4 relative overflow-hidden fade-in">
                    ${isAuthor ? `
                        <button onclick="deleteRide('${ride.id}')" class="absolute top-4 right-4 text-gray-300 hover:text-red-500 transition-colors" title="Eintrag löschen">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    ` : ''}
                    
                    <div class="flex items-start gap-4">
                        <div class="w-12 h-12 rounded-full ${isOffer ? 'bg-blue-50 text-blue-500' : 'bg-orange-50 text-orange-500'} flex items-center justify-center flex-shrink-0 mt-1">
                            <i class="fa-solid ${isOffer ? 'fa-car-side' : 'fa-hand'} text-xl"></i>
                        </div>
                        <div class="flex-grow pr-6">
                            <span class="inline-block px-2 py-1 rounded text-xs font-semibold ${badgeClass} mb-2">
                                ${isOffer ? 'Angebot' : 'Gesuch'}
                            </span>
                            <h4 class="text-lg font-bold text-gray-800 mb-1">${ride.name}</h4>
                            
                            <div class="text-sm text-gray-600 flex flex-col gap-1">
                                <div class="flex items-center gap-2">
                                    <i class="fa-solid fa-location-dot w-4 text-center text-gray-400"></i>
                                    <span>${ride.location}</span>
                                </div>
                                <div class="flex items-center gap-2">
                                    <i class="fa-solid fa-calendar w-4 text-center text-gray-400"></i>
                                    <span>${formattedDate}, ${ride.time} Uhr</span>
                                </div>
                                <div class="flex items-center gap-2">
                                    <i class="fa-solid ${iconClass} w-4 text-center text-gray-400"></i>
                                    <span>${seatsLabel}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mt-2 border-t border-gray-100 pt-4">
                        <button onclick="shareToWhatsApp('${ride.id}')" class="w-full flex items-center justify-center gap-2 bg-[#25D366] hover:bg-[#20bd5a] text-white font-medium py-2 rounded-lg transition-colors shadow-sm">
                            <i class="fa-brands fa-whatsapp text-lg"></i>
                            In WhatsApp teilen
                        </button>
                    </div>
                </div>
            `;
        }

        // Tab and Modal helpers
        function switchTab(tab) {
            currentTab = tab;
            const tabOffers = document.getElementById('tabOffers');
            const tabRequests = document.getElementById('tabRequests');
            const offersView = document.getElementById('offersView');
            const requestsView = document.getElementById('requestsView');

            if (tab === 'offers') {
                tabOffers.className = "flex-1 py-3 text-center tab-active transition-colors flex items-center justify-center gap-2";
                tabRequests.className = "flex-1 py-3 text-center tab-inactive transition-colors flex items-center justify-center gap-2";
                offersView.classList.remove('hidden');
                requestsView.classList.add('hidden');
            } else {
                tabRequests.className = "flex-1 py-3 text-center tab-active transition-colors flex items-center justify-center gap-2";
                tabOffers.className = "flex-1 py-3 text-center tab-inactive transition-colors flex items-center justify-center gap-2";
                requestsView.classList.remove('hidden');
                offersView.classList.add('hidden');
            }
        }

        function openModal(id) {
            document.getElementById(id).classList.remove('hidden');
            // Prevent scrolling on body
            document.body.style.overflow = 'hidden';
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
            // Restore scrolling
            document.body.style.overflow = 'auto';
        }

        // Bootstrap
        initApp();
    </script>
</body>
</html>
